server:
  port: 8080

spring:
  application:
    name: achados-e-devolvidos-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/achados_e_devolvidos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # "validate": o Hibernate NUNCA cria, altera ou apaga tabelas — ele só
      # confere, na subida da aplicação, se as entidades batem com o schema
      # que o Flyway já migrou. Quem efetivamente cria o banco é o Flyway
      # (veja spring.flyway abaixo e src/main/resources/db/migration).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      # Limite de POST /api/v1/uploads/images — acima disso o Spring lança
      # MaxUploadSizeExceededException antes mesmo de chegar no Controller
      # (ver GlobalExceptionHandler).
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    # Defaults apontam para o sandbox do Mailtrap (dev/teste, não envia de verdade
    # para caixas reais). Usuário/senha não têm default — mesmo tratamento de
    # JWT_SECRET: sem eles configurados via env, o envio de e-mail falha em runtime,
    # não silenciosamente.
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configurações próprias da aplicação
app:
  jwt:
    # Chave em Base64 com pelo menos 256 bits (32 bytes) para HS256.
    # Gere uma com, por exemplo: openssl rand -base64 32
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutos
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias

  password-reset:
    # Página do frontend para onde o link do e-mail de redefinição aponta
    # (?token=... é anexado pelo AuthService).
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

  swagger:
    # Credencial única (Basic Auth) para abrir /swagger-ui e /v3/api-docs — só o
    # time de dev (frontend + backend) deve ter isso, não é uma conta de usuário
    # do app. Sem default: sem configurar, a aplicação não sobe.
    username: ${SWAGGER_USERNAME}
    password: ${SWAGGER_PASSWORD}

  upload:
    # Pasta local onde as imagens enviadas via POST /api/v1/uploads/images são
    # gravadas (e de onde são servidas em /uploads/**). MVP: disco local, sem
    # sobreviver a um redeploy do container — trocar por S3/R2 é o próximo passo.
    dir: ${UPLOAD_DIR:./uploads}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
