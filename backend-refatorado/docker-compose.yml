services:
  postgres:
    image: postgres:16
    container_name: achados-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - achados-postgres-data:/var/lib/postgresql/data

volumes:
  achados-postgres-data:
